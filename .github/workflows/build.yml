Сделаем APK «Желейный Валера» прямо с телефона Android, без компьютера и Android Studio, через GitHub.

Шаг 1. Скачай проект
Скачать Желейный Валера.zip

В архиве красный мишка, озвучка ответов, микрофон и режим ИИ.
Шаг 2. Создай проект на GitHub
Открой 
github.com/new
.

Зарегистрируйся или войди.

Название репозитория: JeleyniyValera.

Выбери Public.

Нажми Create repository.

Шаг 3. Загрузи архив
В репозитории выбери Add file → Upload files, загрузи скачанный ZIP целиком и нажми Commit changes.

Шаг 4. Добавь автоматическую сборку APK
Выбери Add file → Create new file. В поле имени файла впиши:

.github/workflows/build.yml

Вставь следующий код:


name: Build Valera APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: unzip -q JeleyniyValera-Android-project.zip

      - name: Build APK
        working-directory: JeleyniyValera
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Valera-APK
          path: JeleyniyValera/app/build/outputs/apk/debug/app-debug.apk
